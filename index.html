<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Plume</title>
<style id="css">
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220}
[hidden]{display:none!important}
#os{--bg1:#0f172a;--bg2:#1e3a8a;--fg:#e8eefc;--card:rgba(255,255,255,.1);--win:#111a2e;--line:rgba(255,255,255,.14);position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[data-theme=light] #os{--bg1:#dbeafe;--bg2:#fef3c7;--fg:#0f172a;--card:rgba(255,255,255,.75);--win:#fff;--line:rgba(0,0,0,.15)}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:inherit;background:rgba(127,127,127,.16);border:1px solid var(--line);border-radius:8px;padding:8px;-webkit-user-select:text;user-select:text}
#desk{flex:1;position:relative;min-height:0}
#ics{position:absolute;inset:0;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,78px);grid-auto-rows:92px;gap:10px;align-content:start}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;font-size:12px}
.ic b{font-size:28px;width:56px;height:56px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-weight:400}
.w{position:absolute;max-width:100%;max-height:100%;background:var(--win);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px #0007;display:flex;flex-direction:column;overflow:hidden}
.wt{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(127,127,127,.14);cursor:move;touch-action:none}
.wt span{flex:1;font-weight:600}
.wb{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
@media(max-width:700px){.w{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}}
.tb{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.pth{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list,.tout,.ta{flex:1;min-height:0;overflow:auto}
.row{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
.nm{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{opacity:.65;font-size:12px}
.ask{display:flex;gap:6px;padding:8px}
.ask input{flex:1;min-width:0}
.ta{width:100%;resize:none;border:0;border-radius:0;background:transparent;line-height:1.5}
.tout{white-space:pre-wrap;font:13px ui-monospace,Menlo,monospace;padding:8px;-webkit-user-select:text;user-select:text}
.tin{display:flex;gap:6px;align-items:center;padding:6px 8px;border-top:1px solid var(--line);font:13px ui-monospace,Menlo,monospace}
.tin input{flex:1;min-width:0}
.cd{padding:12px;font-size:30px;text-align:right;min-height:64px;overflow:hidden}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.cg button{padding:14px 0;font-size:18px}
#bar{display:flex;align-items:center;gap:8px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:9000}
#run{flex:1;display:flex;gap:6px;overflow:auto}
#run button{white-space:nowrap}
#pane{position:absolute;right:10px;bottom:62px;width:min(340px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;background:var(--win);border:1px solid var(--line);border-radius:14px;padding:14px;z-index:9500;box-shadow:0 10px 40px #0008}
#pane p{margin:10px 0}
.code{font:700 26px ui-monospace,Menlo,monospace;letter-spacing:.2em}
#tt{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;z-index:9600}
#mir{position:fixed;inset:0;background:#000;z-index:99999;outline:0;cursor:default}
#mf{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none}
#mq{position:absolute;top:8px;right:8px;z-index:2;background:#dc2626;color:#fff;border:0;opacity:.85}
</style>
</head>
<body>
<div id="os">
  <div id="desk"><div id="ics"></div></div>
  <div id="pane" hidden></div>
  <div id="tt" hidden></div>
  <div id="bar"><div id="run"></div><button id="sh">📡 Partager</button><span id="clk"></span></div>
</div>
<div id="mir" hidden tabindex="0"><iframe id="mf" title="Écran distant"></iframe><button id="mq">✕ Quitter</button></div>
<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
let fs=null;try{fs=JSON.parse(ST('plume.fs'))}catch(e){}
fs=fs||{n:'/',d:1,c:[{n:'Documents',d:1,c:[{n:'Bienvenue.txt',t:'Bienvenue dans Plume ! 🪶\nUn mini‑OS ultra léger.'}]},{n:'Images',d:1,c:[]}]};
const find=p=>{let n=fs;for(const s of p.split('/').filter(Boolean)){n=n.d&&n.c.find(x=>x.n===s);if(!n)return null}return n};
const split=p=>{const i=p.lastIndexOf('/');return[find(p.slice(0,i)||'/'),p.slice(i+1)]};
const join=(a,b)=>(a==='/'?'':a)+'/'+b;
let wins=[],z=10,cnt=0;
const save=()=>{ST('plume.fs',JSON.stringify(fs));wins.forEach(s=>s.redraw&&s.redraw())};
const toast=m=>{const t=$('#tt');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,2200)};

/* ---------- Applications ---------- */
function filesApp(b,s){let cwd='/',ask=null;
 const draw=()=>{let n=find(cwd);if(!n||!n.d){cwd='/';n=fs}
  const rows=[...n.c].sort((x,y)=>(y.d?1:0)-(x.d?1:0)||x.n.localeCompare(y.n)).map(x=>{const p=esc(join(cwd,x.n));return`<div class="row"><span class="nm" data-a="op" data-p="${p}">${x.d?'📁':'📄'} ${esc(x.n)}</span><button data-a="rn" data-p="${p}">✎</button>${x.d?'':`<button data-a="dl" data-p="${p}">⬇</button>`}<button data-a="rm" data-p="${p}">🗑</button></div>`}).join('')||'<p class="mut" style="padding:10px">Dossier vide</p>';
  b.innerHTML=`<div class="tb"><button data-a="up">↑</button><span class="pth">${esc(cwd)}</span><button data-a="nd">＋📁</button><button data-a="nf">＋📄</button></div>${ask?`<form class="ask"><input name="v" value="${esc(ask.v||'')}" placeholder="${esc(ask.l)}" autocomplete="off"><button>OK</button><button type="button" data-a="no">✕</button></form>`:''}<div class="list">${rows}</div>`;
  const i=$('input',b);i&&i.focus()};
 b.onclick=e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,p=t.dataset.p;
  if(a==='up')cwd=cwd.replace(/\/[^/]*$/,'')||'/';
  else if(a==='nd')ask={l:'Nom du dossier',k:'nd'};
  else if(a==='nf')ask={l:'Nom du fichier',k:'nf'};
  else if(a==='no')ask=null;
  else if(a==='rn')ask={l:'Nouveau nom',k:'rn',p,v:p.split('/').pop()};
  else if(a==='op'){const n=find(p);if(n.d)cwd=p;else{openApp('notes',p);return}}
  else if(a==='dl'){const n=find(p),l=document.createElement('a');l.href=URL.createObjectURL(new Blob([n.t||''],{type:'text/plain'}));l.download=n.n;l.click()}
  else if(a==='rm'){const[par,nm]=split(p);par.c=par.c.filter(x=>x.n!==nm);save()}
  draw()};
 b.onsubmit=e=>{e.preventDefault();const v=e.target.elements.v.value.trim().replace(/\//g,'');if(!v||!ask)return;
  if(ask.k==='rn'){const[par]=split(ask.p);if(par.c.some(x=>x.n===v))return toast('Ce nom existe déjà');find(ask.p).n=v}
  else{const n=find(cwd);if(n.c.some(x=>x.n===v))return toast('Ce nom existe déjà');n.c.push(ask.k==='nd'?{n:v,d:1,c:[]}:{n:v,t:''})}
  ask=null;save();draw()};
 s.redraw=draw;draw()}

function notesApp(b,s){let p=s.arg;
 if(!p){const d=find('/Documents')||fs,base=d===fs?'/':'/Documents';let i=1;while(d.c.some(x=>x.n==='Note '+i+'.txt'))i++;d.c.push({n:'Note '+i+'.txt',t:''});p=join(base,'Note '+i+'.txt');save()}
 const n=find(p);if(!n){b.textContent='Fichier introuvable';return}
 b.innerHTML=`<div class="tb"><span class="pth">${esc(p)}</span><span class="mut sv"></span></div><textarea class="ta" spellcheck="false"></textarea>`;
 const ta=$('textarea',b);ta.value=n.t||'';let t;
 ta.oninput=()=>{n.t=ta.value;clearTimeout(t);t=setTimeout(()=>{save();$('.sv',b).textContent='✔ Enregistré'},400)}}

function termApp(b){let cwd='/',out=['Plume 1.0 — tape « help »'];
 const res=p=>{const a=p[0]==='/'?[]:cwd.split('/').filter(Boolean);p.split('/').forEach(x=>{if(x==='..')a.pop();else if(x&&x!=='.')a.push(x)});return'/'+a.join('/')};
 const draw=()=>{b.innerHTML=`<div class="tout">${esc(out.join('\n'))}</div><form class="tin"><span>${esc(cwd)} $</span><input name="c" autocomplete="off" autocapitalize="none" spellcheck="false"></form>`;$('.tout',b).scrollTop=1e9;$('input',b).focus()};
 const run=l=>{out.push(cwd+' $ '+l);l=l.trim();if(!l)return;
  const m=l.match(/^echo\s+(.*?)\s*>\s*(\S+)$/);
  if(m){const[par,nm]=split(res(m[2]));if(!par||!par.d)return out.push('dossier introuvable');let f=par.c.find(x=>x.n===nm);if(!f)par.c.push(f={n:nm,t:''});f.t=m[1];save();return}
  const[c,...a]=l.split(/\s+/),A=a[0]?res(a[0]):cwd,n=find(A);
  switch(c){
   case'help':out.push('help ls cd pwd mkdir touch cat rm clear date whoami · echo texte > fichier');break;
   case'ls':out.push(n&&n.d?n.c.map(x=>x.n+(x.d?'/':'')).join('  ')||'(vide)':'introuvable');break;
   case'cd':if(n&&n.d)cwd=A;else out.push('dossier introuvable');break;
   case'pwd':out.push(cwd);break;
   case'mkdir':case'touch':{if(!a[0]){out.push('nom manquant');break}const[par,nm]=split(A);if(!par||!par.d)out.push('dossier introuvable');else if(par.c.some(x=>x.n===nm))out.push('existe déjà');else{par.c.push(c==='mkdir'?{n:nm,d:1,c:[]}:{n:nm,t:''});save()}break}
   case'cat':out.push(n&&!n.d?n.t||'':'fichier introuvable');break;
   case'rm':{if(!a[0]||!n||n===fs){out.push('introuvable');break}const[par,nm]=split(A);par.c=par.c.filter(x=>x.n!==nm);save();break}
   case'clear':out=[];break;
   case'date':out.push(new Date().toLocaleString('fr-FR'));break;
   case'whoami':out.push('plume');break;
   default:out.push(c+' : commande inconnue')}};
 b.onsubmit=e=>{e.preventDefault();run(e.target.elements.c.value);draw()};draw()}

function calcApp(b){let e='';const K='C ⌫ ( ) 7 8 9 / 4 5 6 * 1 2 3 - 0 . = +'.split(' ');
 b.innerHTML=`<div class="cd"><div class="cm">0</div></div><div class="cg">${K.map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>`;
 const m=$('.cm',b),show=()=>m.textContent=e||'0';
 const press=k=>{if(e==='Erreur')e='';
  if(k==='C')e='';else if(k==='⌫')e=e.slice(0,-1);
  else if(k==='='){if(!e)return;try{if(!/^[0-9+\-*/().\s]+$/.test(e))throw 0;const r=Function('"use strict";return('+e+')')();if(!isFinite(r))throw 0;e=String(+r.toFixed(10))}catch(x){e='Erreur'}}
  else e+=k;show()};
 b.onclick=ev=>{const t=ev.target.closest('[data-k]');t&&press(t.dataset.k)};
 b.tabIndex=0;
 b.onkeydown=ev=>{const k=ev.key==='Enter'?'=':ev.key==='Backspace'?'⌫':ev.key==='Escape'?'C':ev.key;if(K.includes(k)){ev.preventDefault();press(k)}}}

function webApp(b){
 b.innerHTML=`<form class="ask"><input name="u" placeholder="Adresse ou recherche" autocomplete="off" autocapitalize="none"><button>Ouvrir</button></form><p class="mut" style="padding:0 10px">S'ouvre dans un nouvel onglet de cet appareil.</p><div class="list">${['wikipedia.org','openstreetmap.org','duckduckgo.com'].map(u=>`<div class="row"><span class="nm" data-u="${u}">🌐 ${u}</span></div>`).join('')}</div>`;
 const go=v=>{v=v.trim();if(!v)return;const u=/^https?:\/\//.test(v)?v:/^\S+\.\S+$/.test(v)?'https://'+v:'https://duckduckgo.com/?q='+encodeURIComponent(v);window.open(u,'_blank','noopener')};
 b.onsubmit=e=>{e.preventDefault();go(e.target.elements.u.value)};
 b.onclick=e=>{const t=e.target.closest('[data-u]');t&&go(t.dataset.u)}}

function setApp(b){
 const draw=()=>{const l=document.documentElement.dataset.theme==='light';b.innerHTML=`<div class="list"><div class="row"><span class="nm">Thème : ${l?'clair':'sombre'}</span><button data-a="th">Changer</button></div><div class="row"><span class="nm">Effacer toutes les données</span><button data-a="rs">Effacer</button></div><p class="mut" style="padding:10px">Plume 1.0 — mini‑OS ultra léger.</p></div>`};
 b.onclick=e=>{const a=e.target.dataset.a;
  if(a==='th'){const l=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=l?'dark':'light';ST('plume.th',l?'dark':'light')}
  if(a==='rs'){try{localStorage.clear()}catch(x){}location.reload()}
  draw()};draw()}

const APPS={files:{t:'Fichiers',i:'📁',r:filesApp},notes:{t:'Notes',i:'📝',r:notesApp},term:{t:'Terminal',i:'⌨️',r:termApp,w:420,h:300},calc:{t:'Calculatrice',i:'🧮',r:calcApp,w:260,h:380},web:{t:'Web',i:'🌐',r:webApp},set:{t:'Réglages',i:'⚙️',r:setApp,w:320,h:220}};

/* ---------- Fenêtres ---------- */
const chips=()=>{$('#run').innerHTML=wins.map(s=>`<button data-f="${s.id}">${APPS[s.app].i} ${APPS[s.app].t}</button>`).join('')};
function openApp(app,arg){const A=APPS[app],k=cnt++,w=document.createElement('div');
 w.className='w';w.style.cssText=`left:${40+k%6*28}px;top:${24+k%6*28}px;width:${A.w||340}px;height:${A.h||360}px;z-index:${++z}`;
 w.innerHTML=`<div class="wt"><b>${A.i}</b><span>${A.t}</span><button data-x>✕</button></div><div class="wb"></div>`;
 $('#desk').appendChild(w);
 const b=$('.wb',w),s={id:k,app,w,b,arg};wins.push(s);
 w.onpointerdown=()=>{w.style.zIndex=++z};
 $('.wt',w).onpointerdown=e=>{if(e.target.closest('button'))return;const dx=e.clientX-w.offsetLeft,dy=e.clientY-w.offsetTop;
  const mv=ev=>{w.style.left=Math.max(0,ev.clientX-dx)+'px';w.style.top=Math.max(0,ev.clientY-dy)+'px'};
  const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up)};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up)};
 $('[data-x]',w).onclick=()=>{w.remove();wins=wins.filter(x=>x!==s);chips()};
 A.r(b,s);chips();return s}
$('#run').onclick=e=>{const t=e.target.closest('[data-f]');const s=t&&wins.find(x=>x.id==t.dataset.f);if(s)s.w.style.zIndex=++z};
$('#ics').innerHTML=Object.keys(APPS).map(k=>`<button class="ic" data-o="${k}"><b>${APPS[k].i}</b>${APPS[k].t}</button>`).join('');
$('#ics').onclick=e=>{const t=e.target.closest('[data-o]');t&&openApp(t.dataset.o)};

/* ---------- Partage d'écran ---------- */
let peer,conn,obs,tmr=0,last='',ready=0,pend=null,geo=null;
const pane=$('#pane'),mir=$('#mir'),mf=$('#mf');
const lib=()=>window.Peer?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');s.src='lib/peerjs.min.js';s.onload=ok;s.onerror=()=>ko(new Error('lib'));document.head.appendChild(s)});
function drawPane(x){pane.innerHTML=`<b>📡 Partage d'écran</b><p><b>📺 Par câble (sans réseau)</b><br>Relie l'iPhone à l'écran avec un adaptateur Lightning ou USB‑C → HDMI, puis choisis l'entrée HDMI de l'écran. Clavier et souris en Bluetooth sur l'iPhone.</p><p><b>📡 Par réseau</b><br><span class="mut">Les deux appareils doivent être en ligne (ex. partage de connexion de l'iPhone).</span></p><div class="tb"><button data-s="host">Je suis le téléphone</button><button data-s="join">Je suis l'ordinateur</button></div>${x||''}`}
$('#sh').onclick=()=>{pane.hidden=!pane.hidden;if(!pane.hidden)drawPane()};
pane.onclick=e=>{const t=e.target.closest('[data-s]');if(!t)return;if(t.dataset.s==='host')host();else drawPane('<form class="ask"><input name="c" inputmode="numeric" maxlength="6" placeholder="Code à 6 chiffres" autocomplete="off"><button>Connecter</button></form>')};
pane.onsubmit=e=>{e.preventDefault();joinPeer(e.target.elements.c.value.trim())};

/* téléphone : envoie son écran */
function frame(){const os=$('#os'),L=$$('*',os),C=os.cloneNode(true),M=$$('*',C);
 L.forEach((a,i)=>{const b=M[i];if(!b)return;if(a.tagName==='INPUT')b.setAttribute('value',a.value);else if(a.tagName==='TEXTAREA')b.textContent=a.value;if(a.scrollHeight>a.clientHeight+1)b.setAttribute('data-st',a.scrollTop)});
 return{t:'f',w:innerWidth,h:innerHeight,th:document.documentElement.dataset.theme||'dark',html:C.innerHTML}}
const EV=['input','scroll','resize'];
function startMirror(){stopMirror();last='';
 const push=()=>{tmr=0;if(!conn||!conn.open)return;const f=frame(),k=f.w+'x'+f.h+f.th+f.html;if(k===last)return;last=k;try{conn.send(f)}catch(e){}};
 const sch=()=>{tmr=tmr||setTimeout(push,120)};
 obs=new MutationObserver(sch);obs.observe($('#os'),{subtree:true,childList:true,attributes:true,characterData:true});
 obs.sch=sch;EV.forEach(v=>addEventListener(v,sch,true));push()}
function stopMirror(){if(obs){EV.forEach(v=>removeEventListener(v,obs.sch,true));obs.disconnect();obs=null}clearTimeout(tmr);tmr=0}
async function host(){try{drawPane('<p class="mut">Connexion…</p>');await lib();
 const code=String(100000+Math.floor(Math.random()*900000));peer=new Peer('plume-'+code);
 await new Promise((ok,ko)=>{peer.on('open',ok);peer.on('error',ko)});
 drawPane(`<p>Code : <span class="code">${code}</span><br><span class="mut">Saisis‑le sur l'ordinateur.</span></p>`);
 peer.on('connection',c=>{c.on('open',()=>{conn=c;toast('Ordinateur connecté');startMirror()});c.on('data',rx);c.on('close',stopMirror)})
 }catch(e){drawPane('<p>Impossible de joindre le serveur de jumelage : une connexion internet est nécessaire.</p>')}}

/* téléphone : reçoit souris / clavier de l'ordinateur */
function rx(m){if(!m||!m.t)return;const W=innerWidth,H=innerHeight,at=()=>document.elementFromPoint(m.x*W,m.y*H);
 const P=(t,type)=>{const o={bubbles:true,clientX:m.x*W,clientY:m.y*H,pointerId:1,isPrimary:true,button:0};t.dispatchEvent(typeof PointerEvent==='function'?new PointerEvent(type,o):new MouseEvent(type,o))};
 if(m.t==='pd'){rx.d=at();rx.p=m;rx.d&&P(rx.d,'pointerdown')}
 else if(m.t==='pm')P(document,'pointermove');
 else if(m.t==='pu'){P(document,'pointerup');const u=at(),d=rx.d;rx.d=null;
  if(d&&(u===d||Math.hypot(m.x-rx.p.x,m.y-rx.p.y)<.01)){d.focus&&d.focus();d.click();if(/^(INPUT|TEXTAREA)$/.test(d.tagName))try{d.setSelectionRange(d.value.length,d.value.length)}catch(e){}}}
 else if(m.t==='w'){let el=at();while(el&&el.scrollHeight<=el.clientHeight)el=el.parentElement;if(el)el.scrollTop+=m.dy}
 else if(m.t==='k')key(m)}
function key(m){const a=document.activeElement,k=m.k;
 if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)){
  const pos=()=>{const s=a.selectionStart==null?a.value.length:a.selectionStart;return[s,a.selectionEnd==null?s:a.selectionEnd]};
  const set=(v,c)=>{a.value=v;try{a.setSelectionRange(c,c)}catch(e){}a.dispatchEvent(new Event('input',{bubbles:true}))};
  const[s,e]=pos();
  if(k.length===1&&!m.c)set(a.value.slice(0,s)+k+a.value.slice(e),s+1);
  else if(k==='Backspace'){if(s!==e)set(a.value.slice(0,s)+a.value.slice(e),s);else if(s>0)set(a.value.slice(0,s-1)+a.value.slice(s),s-1)}
  else if(k==='Enter'){if(a.tagName==='TEXTAREA')set(a.value.slice(0,s)+'\n'+a.value.slice(e),s+1);else if(a.form)a.form.requestSubmit?a.form.requestSubmit():a.form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))}
 }else(a||document.body).dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true}))}

/* ordinateur : affiche l'écran du téléphone */
async function joinPeer(code){if(!/^\d{6}$/.test(code))return toast('Le code comporte 6 chiffres');
 try{drawPane('<p class="mut">Connexion…</p>');await lib();peer=new Peer();
  peer.on('error',()=>drawPane('<p>Code introuvable ou téléphone hors ligne.</p>'));
  peer.on('open',()=>{const c=peer.connect('plume-'+code,{reliable:true});
   c.on('open',()=>{conn=c;showMir()});c.on('data',d=>{if(d&&d.t==='f')applyFrame(d)});c.on('close',hideMir)})
 }catch(e){drawPane('<p>Une connexion internet est nécessaire pour le jumelage.</p>')}}
function showMir(){pane.hidden=true;ready=0;pend=null;
 mf.onload=()=>{ready=1;pend&&applyFrame(pend)};
 mf.srcdoc='<!doctype html><html><head><meta charset="utf-8"><style>'+$('#css').textContent+'</style></head><body style="margin:0"><div id="os"></div></body></html>';
 mir.hidden=false;mir.focus();try{document.documentElement.requestFullscreen()}catch(e){}}
function hideMir(){mir.hidden=true;mf.removeAttribute('srcdoc');geo=null;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
 try{conn&&conn.close()}catch(e){}conn=null;try{peer&&peer.destroy()}catch(e){}}
function applyFrame(f){const d=mf.contentDocument;if(!ready||!d||!d.getElementById('os')){pend=f;return}pend=null;
 d.documentElement.dataset.theme=f.th;mf.style.width=f.w+'px';mf.style.height=f.h+'px';
 d.getElementById('os').innerHTML=f.html;$$('[data-st]',d).forEach(e=>e.scrollTop=+e.dataset.st);geo=f;fit()}
function fit(){if(!geo)return;const s=Math.min(innerWidth/geo.w,innerHeight/geo.h);mf.style.transform='scale('+s+')';mf.style.left=(innerWidth-geo.w*s)/2+'px';mf.style.top=(innerHeight-geo.h*s)/2+'px'}
addEventListener('resize',fit);
const tx=m=>{conn&&conn.open&&conn.send(m)};
const nm=e=>{const r=mf.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}};
let dn=0;
mir.onmousedown=e=>{if(e.target.id==='mq')return;dn=1;mir.focus();tx({t:'pd',...nm(e)})};
mir.onmousemove=e=>{if(dn)tx({t:'pm',...nm(e)})};
mir.onmouseup=e=>{if(dn){dn=0;tx({t:'pu',...nm(e)})}};
mir.onwheel=e=>{e.preventDefault();tx({t:'w',...nm(e),dy:e.deltaY})};
mir.oncontextmenu=e=>e.preventDefault();
mir.onkeydown=e=>{if(e.key==='F11')return;e.preventDefault();tx({t:'k',k:e.key,c:e.ctrlKey||e.metaKey})};
$('#mq').onclick=hideMir;

/* ---------- Démarrage ---------- */
document.documentElement.dataset.theme=ST('plume.th')||'dark';
const clk=()=>$('#clk').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});clk();setInterval(clk,20000);
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__plume={openApp,frame,applyFrame,rx,key,wins:()=>wins,fs:()=>fs,showMir,ready:()=>ready};
})();
</script>
